<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Solar H2 Mobility</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#dashboard"><span class="brand-mark">✦</span><span>SOLAR <b>H2</b><small>MOBILITY PLATFORM</small></span></a>
      <nav class="nav" aria-label="주 메뉴">
        <button class="nav-item active" data-page="dashboard"><i>▦</i>대시보드</button>
        <button class="nav-item" data-page="panel"><i>◫</i>태양광 패널 관리</button>
        <button class="nav-item" data-page="vehicle"><i>⌁</i>수소차 관리</button>
        <button class="nav-item" data-page="analytics"><i>⌇</i>에너지 분석</button>
        <button class="nav-item" data-page="impact"><i>◌</i>친환경 효과</button>
        <button class="nav-item" data-page="alerts"><i>♢</i>알림 센터 <em id="alertBadge">3</em></button>
      </nav>
      <div class="side-bottom"><button class="nav-item" data-page="settings"><i>⚙</i>설정</button><div class="demo-badge"><span></span> DEMO · 가상 센서 데이터</div></div>
    </aside>
    <main>
      <header class="topbar"><button class="menu-toggle" id="menuToggle">☰</button><div class="breadcrumb"><span id="pageEyebrow">OVERVIEW</span><h1 id="pageTitle">에너지 흐름을 한눈에</h1></div><div class="top-actions"><span class="live"><i></i> LIVE SYNC</span><button class="icon-button" id="quickAlert" aria-label="알림">♢<b id="topBadge">3</b></button><div class="avatar">HS</div></div></header>
      <section id="content"></section>
    </main>
  </div>
  <template id="dashboard-template">
    <div class="page dashboard-page">
      <section class="hero"><div><p class="section-label">GOOD MORNING, HYEONSU</p><h2>오늘도 <mark>깨끗한 에너지</mark>로<br>움직이고 있어요.</h2><p class="muted">2026년 11월 18일 수요일 · 데이터는 5초마다 동기화됩니다.</p></div><div class="energy-orbit"><div class="orbit-core"><strong id="heroEnergy">12.8</strong><span>kWh 생산 중</span></div><span class="orbit-dot d1"></span><span class="orbit-dot d2"></span><span class="orbit-dot d3"></span></div></section>
      <section class="notice warning" id="cleanNotice"><div class="notice-icon">✦</div><div><b>패널 세척을 권장해요</b><p>현재 오염도 67%로 발전 효율이 평소보다 낮습니다. 세척 후 최대 14% 개선이 예상됩니다.</p></div><button class="outline-btn" id="ackClean">확인했어요</button><button class="close-btn" id="dismissNotice">×</button></section>
      <div class="section-head"><div><p class="section-label">REAL-TIME SNAPSHOT</p><h3>오늘의 운영 현황</h3></div><span class="updated">● 마지막 업데이트 <span id="clock">09:42:18</span></span></div>
      <section class="metrics-grid" id="metrics"></section>
      <section class="dashboard-lower"><article class="card chart-card"><div class="card-head"><div><p class="section-label">SOLAR GENERATION</p><h3>오늘의 발전 추이</h3></div><div class="period-pills"><button class="active">일</button><button>주</button><button>월</button></div></div><div class="chart-wrap"><svg id="solarChart" viewBox="0 0 700 230" preserveAspectRatio="none"></svg><div class="chart-labels"><span>06:00</span><span>09:00</span><span>12:00</span><span>15:00</span><span>18:00</span></div></div><div class="chart-foot"><span><i class="dot green"></i>태양광 발전량</span><b><span id="todayGen">48.6</span> kWh <small>▲ 12.4%</small></b></div></article>
        <article class="card flow-card"><div class="card-head"><div><p class="section-label">ENERGY FLOW</p><h3>에너지 흐름</h3></div><button class="more">•••</button></div><div class="flow"><div class="flow-node sun">☀<span>태양광</span><b>12.8 kW</b></div><div class="flow-line"></div><div class="flow-node battery">▥<span>저장 에너지</span><b>34.6 kWh</b></div><div class="flow-line"></div><div class="flow-node car">▱<span>NEXO</span><b>68%</b></div></div><div class="flow-summary"><div><span>자급률</span><b>74.2%</b></div><div><span>오늘 절감</span><b>₩ 6,840</b></div></div></article></section>
    </div>
  </template>
  <template id="panel-template"><div class="page"><div class="page-intro"><p class="section-label">SOLAR PANEL HEALTH</p><h2>태양광 패널 관리</h2><p>센서 기반 상태 진단과 발전 성능을 분석합니다.</p></div><section class="panel-layout"><article class="card panel-visual"><div class="panel-top"><div><span class="status-pill caution">● 세척 권장</span><h3>옥상 A동 · 24개 패널</h3></div><button class="primary-btn" id="cleanPanel">세척 완료 처리</button></div><div class="solar-array"><div class="sun-ray">☀</div><div class="panel-grid" id="panelGrid"></div></div><div class="legend"><span><i class="dot clean"></i>깨끗함</span><span><i class="dot okay"></i>양호</span><span><i class="dot dirty"></i>오염 주의</span><span><i class="dot danger"></i>세척 권장</span></div></article><aside class="panel-details"><article class="card"><p class="section-label">CONTAMINATION INDEX</p><div class="radial"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="50"/><circle class="radial-value" cx="60" cy="60" r="50"/></svg><div><b id="dirtValue">67</b><span>%</span><small>청소 권장</small></div></div><p class="muted center">세척 기준을 7% 초과했어요.</p></article><article class="card compare"><p class="section-label">CLEANING IMPACT</p><h3>세척 전후 예상 효율</h3><div class="compare-row"><span>현재</span><div><i style="width:76%"></i></div><b>76%</b></div><div class="compare-row good"><span>세척 후</span><div><i style="width:90%"></i></div><b>90%</b></div><p class="improve">↗ 최대 14%p 개선 예상</p></article></aside></section><section class="card table-card"><div class="card-head"><div><p class="section-label">HISTORY</p><h3>최근 7일 발전 기록</h3></div><select id="panelPeriod"><option>최근 7일</option><option>최근 30일</option></select></div><div class="bar-chart" id="weeklyBars"></div></section></div></template>
  <template id="vehicle-template"><div class="page"><div class="page-intro"><p class="section-label">VEHICLE TELEMETRY</p><h2>수소차 관리</h2><p>차량 운행 상태와 수소 에너지 효율을 실시간으로 확인하세요.</p></div><section class="vehicle-hero card"><div class="vehicle-info"><span class="model-tag">HYUNDAI NEXO</span><h2>2026 NEXO Hydrogen</h2><p class="muted">12가 3456 · 연결 상태 정상</p><div class="car-illustration">▱</div></div><div class="vehicle-gauges"><div class="big-gauge"><svg viewBox="0 0 200 120"><path d="M20 100 A80 80 0 0 1 180 100"/><path class="gauge-fill" d="M20 100 A80 80 0 0 1 180 100"/></svg><div><b id="vehicleEff">84</b><span>%</span><small>에너지 효율</small></div></div><div class="gauge-copy"><span class="status-pill good">● 정상 운행 중</span><h3>아주 효율적인 주행이에요</h3><p>최근 평균보다 3.8% 높은 효율을 기록 중입니다.</p></div></div></section><section class="metrics-grid vehicle-cards" id="vehicleMetrics"></section><section class="card advice"><div class="advice-icon">⌁</div><div><p class="section-label">SMART INSIGHT</p><h3>에너지 효율을 유지하고 있어요</h3><p>타이어 공기압과 실내 온도를 현재 수준으로 유지하면 최적 효율을 지속할 수 있습니다.</p></div><button class="outline-btn">운전 팁 보기</button></section></div></template>
  <template id="analytics-template"><div class="page"><div class="page-intro split"><div><p class="section-label">DATA INTELLIGENCE</p><h2>에너지 분석</h2><p>발전량과 모빌리티 데이터를 함께 분석합니다.</p></div><div class="period-pills big"><button class="active">7일</button><button>30일</button><button>3개월</button></div></div><section class="analytics-grid"><article class="card chart-card"><div class="card-head"><div><p class="section-label">GENERATION VS. CONSUMPTION</p><h3>발전량 · 차량 소비량</h3></div><span class="chip">kWh</span></div><div class="compare-chart" id="compareChart"></div><div class="chart-legend"><span><i class="dot green"></i>태양광 발전</span><span><i class="dot navy"></i>차량 소비</span></div></article><article class="card insight-card"><p class="section-label">KEY INSIGHT</p><div class="insight-number">74<span>%</span></div><h3>태양광 에너지 자급률</h3><p>지난 7일간 차량 소비 에너지의 74%를 태양광으로 충당했어요.</p><div class="mini-trend">↗ 8.2% <span>지난주 대비</span></div></article></section><section class="card correlation"><div class="card-head"><div><p class="section-label">PANEL PERFORMANCE</p><h3>패널 오염도와 발전 효율의 관계</h3></div><button class="more">•••</button></div><div class="correlation-body"><div class="scatter" id="scatter"></div><div class="correlation-note"><span class="status-pill caution">현재 위치</span><h3>오염도 67%, 효율 76%</h3><p>오염도가 60%를 넘으면 발전 효율 하락 속도가 빨라집니다. 지금 세척하면 손실 발전량을 회복할 수 있어요.</p><button class="primary-btn" data-nav="panel">패널 상태 확인</button></div></div></section></div></template>
  <template id="impact-template"><div class="page"><div class="page-intro"><p class="section-label">SUSTAINABILITY REPORT</p><h2>친환경 효과</h2><p>깨끗한 에너지가 만든 실질적인 변화입니다.</p></div><section class="impact-hero"><div class="impact-copy"><p class="section-label">TOTAL IMPACT · 2026</p><h2><mark>2.84 t</mark>의 탄소를<br>줄였어요.</h2><p>성목 약 431그루가 1년간 흡수하는 탄소량과 같아요.</p></div><div class="earth">◌<span>CO₂</span></div></section><section class="metrics-grid impact-metrics"><article class="metric-card"><span>누적 태양광 발전량</span><b>8,492 <small>kWh</small></b><p>↗ 18.4% 전년 대비</p></article><article class="metric-card"><span>누적 에너지 절감</span><b>₩ 1,273,800</b><p>↗ 12.8% 전년 대비</p></article><article class="metric-card"><span>절감한 CO₂</span><b>2,841 <small>kg</small></b><p>↗ 16.2% 전년 대비</p></article></section><section class="card equivalence"><div><p class="section-label">YOUR POSITIVE FOOTPRINT</p><h3>이만큼의 친환경 효과를 만들었어요</h3></div><div class="equiv-items"><span>🌳<b>431</b>그루 식재</span><span>🚗<b>11,255</b>km 전기차 주행</span><span>💡<b>1,043</b>일 LED 사용</span></div></section></div></template>
  <template id="alerts-template"><div class="page"><div class="page-intro split"><div><p class="section-label">NOTIFICATION CENTER</p><h2>알림 센터</h2><p>운영에 필요한 중요 알림을 확인하세요.</p></div><button class="outline-btn" id="readAll">모두 읽음 처리</button></div><section class="alert-list" id="alertList"></section></div></template>
  <template id="settings-template"><div class="page"><div class="page-intro"><p class="section-label">PREFERENCES</p><h2>설정</h2><p>Solar H2 Mobility 환경을 관리합니다.</p></div><section class="settings card"><div><h3>가상 센서 데이터</h3><p>데모용 시뮬레이션 데이터를 표시합니다.</p></div><label class="switch"><input type="checkbox" checked id="simulation"><span></span></label><div><h3>알림 수신</h3><p>패널 및 차량 상태에 대한 중요 알림을 받습니다.</p></div><label class="switch"><input type="checkbox" checked><span></span></label></section></div></template>
  <script src="app.js"></script>
</body></html>
